<body class="loginpage">
<main class="logincard">
<a class="brand" href="index.html">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#A9481F" stroke-width="2.5"/><circle cx="17" cy="17" r="10" fill="none" stroke="#A9481F" stroke-width="1.2"/><path d="M14 23V11h4.2a3.4 3.4 0 0 1 0 6.8H14" fill="none" stroke="#A9481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>Penny</b><small>by Propono</small>
</a>
<h1>Sign in to your audit workspace</h1>
<form id="loginform" novalidate>
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<div id="loginerr" class="callout bad" role="alert" hidden></div>
<button class="btn" type="submit" id="loginbtn">Sign in</button>
</form>
<p class="small muted">Preview workspace: sample data only. Don't enter client information.</p>
</main>
<footer><nav><a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a> <a href="security.html">Security</a></nav></footer>

</body>
